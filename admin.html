<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | Sri Haridra Collections</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen">

  <div class="max-w-4xl mx-auto p-4 sm:p-6">
    <div class="flex items-center justify-between gap-3 mb-6">
      <div class="flex items-center gap-3">
        <img
          src="logo.jpg"
          alt="Sri Haridra Collections Logo"
          class="w-11 h-11 rounded-full object-contain p-1 border border-amber-300 bg-white shrink-0"
        />
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-amber-950">Sri Haridra — Admin</h1>
          <p class="text-xs text-stone-500">Besides Seshmahal Theater, Tadepalligudem, West Godavari Dist - 534101</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-sm text-amber-800 underline">View Store</a>
        <button id="logout-btn" onclick="logout()" class="hidden bg-stone-700 text-white text-xs px-3 py-1.5 rounded">
          Logout
        </button>
      </div>
    </div>

    <!-- Login Card -->
    <div id="login-box" class="bg-white p-6 rounded-xl shadow max-w-md mx-auto space-y-4">
      <h2 class="font-bold text-lg">Admin Login</h2>
      <input id="login-email" type="email" placeholder="Admin Email" class="w-full border rounded-lg px-3 py-2 text-sm" />
      <input id="login-password" type="password" placeholder="Password" class="w-full border rounded-lg px-3 py-2 text-sm" />
      <button onclick="login()" class="w-full bg-amber-800 hover:bg-amber-900 text-white font-semibold py-2 rounded-lg text-sm">
        Sign In
      </button>
      <p id="login-error" class="text-xs text-rose-600"></p>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden space-y-6">
      <!-- Add Product Form -->
      <form id="add-product-form" onsubmit="addProduct(event)" class="bg-white p-5 rounded-xl shadow space-y-4">
        <h2 class="font-bold text-lg text-amber-950">Add New Jewellery Item</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          <input id="prod-name" type="text" placeholder="Item Name *" required class="border rounded-lg px-3 py-2 text-sm" />
          <select id="prod-category" onchange="updateSubcategoryDropdown()" class="border rounded-lg px-3 py-2 text-sm bg-white">
            <option value="WOMEN">WOMEN</option>
            <option value="MEN">MEN</option>
          </select>
          <select id="prod-subcategory" class="border rounded-lg px-3 py-2 text-sm bg-white"></select>
          <input id="prod-price" type="number" min="1" step="1" placeholder="Price in ₹ *" required class="border rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-xs text-stone-600 mb-1">Product Photo *</label>
          <input id="prod-image" type="file" accept="image/*" required class="text-sm" />
        </div>
        <button id="add-btn" type="submit" class="bg-amber-800 hover:bg-amber-900 text-white font-semibold px-5 py-2 rounded-lg text-sm">
          Upload & Save Item
        </button>
        <p id="form-status" class="text-xs text-stone-600"></p>
      </form>

      <!-- Existing Products List -->
      <div class="bg-white p-5 rounded-xl shadow">
        <h2 class="font-bold text-lg text-amber-950 mb-4">All Products</h2>
        <div id="admin-products-list" class="divide-y"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://oecbemtamkifqnxjhrpw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UxtVebo9sasnQEC6yU0JNw_xJlVnENO";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const CATEGORY_TREE = {
      MEN: [
        "Bracelight(Kadiyam And Chain Model)",
        "Chains(Long And Short Chais)",
        "Rings"
      ],
      WOMEN: [
        "Short Chains",
        "Long Chains",
        "Side Locket Thali Chains",
        "Suthralu",
        "Ear Rings",
        "Women Bracelights(Kadiyam And Chain Model)",
        "Rings",
        "Payals",
        "Haram Sets",
        "Nackles Sets",
        "Total Bridal Sets",
        "Hip Belts(Vaddanam(Plain And Heavy Models)",
        "All CZ Items",
        "Bangles",
        "Black Beads",
        "All Colour Beads",
        "Chandra Haram",
        "Pendent Sets",
        "Vankis",
        "Tikks",
        "Hair Accosaries",
        "Chempa Swaralu"
      ]
    };

    function updateSubcategoryDropdown() {
      const cat = document.getElementById("prod-category").value;
      const subSelect = document.getElementById("prod-subcategory");
      const list = CATEGORY_TREE[cat] || [];
      subSelect.innerHTML = list.map(sub => `<option value="${sub}">${sub}</option>`).join("");
    }

    async function checkSession() {
      const { data: { session } } = await db.auth.getSession();
      toggleDashboard(!!session);
      if (session) loadAdminProducts();
    }

    function toggleDashboard(isLoggedIn) {
      document.getElementById("login-box").classList.toggle("hidden", isLoggedIn);
      document.getElementById("dashboard").classList.toggle("hidden", !isLoggedIn);
      document.getElementById("logout-btn").classList.toggle("hidden", !isLoggedIn);
    }

    async function login() {
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const errEl = document.getElementById("login-error");
      errEl.textContent = "";

      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) {
        errEl.textContent = error.message;
        return;
      }
      checkSession();
    }

    async function logout() {
      await db.auth.signOut();
      checkSession();
    }

    async function addProduct(e) {
      e.preventDefault();
      const btn = document.getElementById("add-btn");
      const statusEl = document.getElementById("form-status");
      const name = document.getElementById("prod-name").value.trim();
      const category = document.getElementById("prod-category").value;
      const subcategory = document.getElementById("prod-subcategory").value;
      const price = Number(document.getElementById("prod-price").value);
      const file = document.getElementById("prod-image").files[0];

      if (!file) return;
      btn.disabled = true;
      statusEl.textContent = "Uploading photo...";

      const fileExt = file.name.split(".").pop();
      const filePath = `${Date.now()}-${Math.random().toString(36).slice(2)}.${fileExt}`;

      const { error: uploadError } = await db.storage
        .from("product-images")
        .upload(filePath, file);

      if (uploadError) {
        statusEl.textContent = "Upload error: " + uploadError.message;
        btn.disabled = false;
        return;
      }

      const { data: urlData } = db.storage
        .from("product-images")
        .getPublicUrl(filePath);

      const { error: insertError } = await db.from("products").insert([{
        name,
        category,
        subcategory,
        price,
        image_url: urlData.publicUrl,
        in_stock: true
      }]);

      btn.disabled = false;
      if (insertError) {
        statusEl.textContent = "Database error: " + insertError.message;
        return;
      }

      statusEl.textContent = "Item added successfully!";
      document.getElementById("add-product-form").reset();
      updateSubcategoryDropdown();
      loadAdminProducts();
    }

    async function loadAdminProducts() {
      const container = document.getElementById("admin-products-list");
      const { data, error } = await db
        .from("products")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        container.innerHTML = `<p class="text-rose-600 text-sm">${error.message}</p>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `<p class="text-stone-400 text-sm py-4">No products added yet.</p>`;
        return;
      }

      container.innerHTML = data.map(p => {
        const meta = [p.category, p.subcategory].filter(Boolean).join(" • ");
        return `
          <div class="py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <img src="${p.image_url || 'logo.jpg'}" alt="${p.name}" class="w-14 h-14 rounded object-cover border" />
              <div>
                <p class="font-semibold text-sm">${p.name}</p>
                <p class="text-xs text-amber-800 font-medium">${meta}</p>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <input
                id="price-${p.id}"
                type="number"
                value="${p.price}"
                class="w-24 border rounded px-2 py-1 text-sm"
              />
              <button onclick="updatePrice('${p.id}')" class="bg-amber-100 hover:bg-amber-200 text-amber-950 text-xs font-semibold px-2.5 py-1.5 rounded">
                Save Price
              </button>
              <button
                onclick="toggleStock('${p.id}', ${!p.in_stock})"
                class="text-xs font-semibold px-2.5 py-1.5 rounded ${
                  p.in_stock ? "bg-emerald-100 text-emerald-800" : "bg-rose-100 text-rose-800"
                }"
              >
                ${p.in_stock ? "In Stock" : "Out of Stock"}
              </button>
              <button onclick="deleteProduct('${p.id}')" class="text-xs text-rose-600 hover:underline px-1">
                Delete
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    async function updatePrice(id) {
      const newPrice = Number(document.getElementById(`price-${id}`).value);
      if (!newPrice || newPrice <= 0) return alert("Enter a valid price");
      const { error } = await db.from("products").update({ price: newPrice }).eq("id", id);
      if (error) alert(error.message);
      else loadAdminProducts();
    }

    async function toggleStock(id, nextStock) {
      const { error } = await db.from("products").update({ in_stock: nextStock }).eq("id", id);
      if (error) alert(error.message);
      else loadAdminProducts();
    }

    async function deleteProduct(id) {
      if (!confirm("Delete this product?")) return;
      const { error } = await db.from("products").delete().eq("id", id);
      if (error) alert(error.message);
      else loadAdminProducts();
    }

    updateSubcategoryDropdown();
    checkSession();
  </script>
</body>
</html>
